name: Build Windows EXE

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Compiler l'exécutable
        run: pyinstaller --noconfirm --onefile --windowed --name RapprochementBancaire app.py
      - uses: actions/upload-artifact@v4
        with:
          name: RapprochementBancaire-windows
          path: dist/RapprochementBancaire.exe
      - name: Publier une release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RapprochementBancaire.exe
